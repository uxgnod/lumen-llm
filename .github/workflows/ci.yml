name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "2.3.8"
          - "2.4.10"
          - "2.7.8"
          - "3.1"
          - "3.4"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
      - run: bin/debug-template examples/templates/translator.yml examples/inputs/translator.json
      - run: gem build --strict --output /tmp/lumen-llm-${{ matrix.ruby }}.gem lumen-llm.gemspec
